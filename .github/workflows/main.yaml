name: main

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CONFIGURATION: Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            name: Linux x64
          - os: ubuntu-24.04-arm
            arch: ARM64
            name: Linux ARM64
          - os: windows-latest
            arch: x64
            name: Windows x64
          - os: windows-11-arm
            arch: ARM64
            name: Windows ARM64
          - os: macos-latest
            arch: ARM64
            name: macOS ARM64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Restore all target frameworks
        run: dotnet restore Icod.Expressions.sln
      - name: Build all target frameworks
        run: dotnet build Icod.Expressions.sln -c ${{ env.CONFIGURATION }} --no-restore -p:ContinuousIntegrationBuild=true
      - name: Run full suite concurrently and verify frozen results
        shell: pwsh
        run: >-
          ./packaging/Invoke-Tests.ps1
          -Path tests/Icod.Expressions.Tests.csproj
          -Configuration '${{ env.CONFIGURATION }}'
          -ContractPath packaging/test-results.json

      - name: Verify exact extraction parity
        shell: bash
        run: |
          set -e
          for framework in net8.0 net9.0 net10.0; do
            dotnet run --project tools/RegularExpressionParityBaseline/RegularExpressionParityBaseline.csproj -c ${{ env.CONFIGURATION }} -f "$framework" -- --verify doc/Icod.Expressions-A04-Parity-Baseline.jsonl
          done
      - name: Compare POSIX ASCII cases with glibc
        if: matrix.os == 'ubuntu-latest'
        run: dotnet run --project tools/PosixRegexDifferential/PosixRegexDifferential.csproj -c ${{ env.CONFIGURATION }}
      - name: Run pinned Gnulib included regex oracle
        if: matrix.os == 'ubuntu-latest'
        run: sh tools/GnulibRegexOracle/run.sh
      - name: Verify A05 candidate corpus identities
        if: matrix.os == 'ubuntu-latest'
        run: sh tools/verify-a05-candidate.sh
      - name: Verify compiled public API members
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          dotnet run --project tools/RegularExpressionApiSnapshot/RegularExpressionApiSnapshot.csproj -c ${{ env.CONFIGURATION }} > /tmp/icod-expressions-api.txt
          diff <(tail -n +2 doc/Icod.Expressions-A00-Compiled-API.txt) <(tail -n +2 /tmp/icod-expressions-api.txt)
      - name: Pack the single library project
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack Icod.Expressions.csproj -c ${{ env.CONFIGURATION }} --no-build --no-restore -o artifacts
      - name: Verify the Release package
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: |
          Import-Module ./packaging/RepositoryTools.psm1 -Force
          $version = Get-MSBuildProperty -ProjectPath Icod.Expressions.csproj -Name Version -Configuration '${{ env.CONFIGURATION }}'
          ./packaging/VerifyPackageArtifact.ps1 -ArtifactDirectory artifacts -Configuration '${{ env.CONFIGURATION }}' -ExpectedVersion $version -ExpectedId Icod.Expressions -ExpectedPackageCount 1
      - name: Restore package-only consumer
        if: matrix.os == 'ubuntu-latest'
        run: dotnet restore samples/PackageSmoke/PackageSmoke.csproj --source artifacts
      - name: Build package-only consumer
        if: matrix.os == 'ubuntu-latest'
        run: dotnet build samples/PackageSmoke/PackageSmoke.csproj -c ${{ env.CONFIGURATION }} --no-restore
      - name: Run package-only consumer
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -e
          for framework in net8.0 net9.0 net10.0; do
            dotnet run --project samples/PackageSmoke/PackageSmoke.csproj -c ${{ env.CONFIGURATION }} --no-build --no-restore -f "$framework"
          done

  macos_x64_tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: net8.0
            sdk: |
              8.0.x
              10.0.x
          - framework: net9.0
            sdk: |
              9.0.x
              10.0.x
          - framework: net10.0
            sdk: 10.0.x
    name: macOS x64 ${{ matrix.framework }}
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/macos-framework
        with:
          framework: ${{ matrix.framework }}
          configuration: ${{ env.CONFIGURATION }}
          sdk: ${{ matrix.sdk }}

  macos_x64:
    name: macOS x64
    needs: macos_x64_tests
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require every native Intel framework job
        shell: bash
        env:
          FRAMEWORK_RESULT: ${{ needs.macos_x64_tests.result }}
        run: test "$FRAMEWORK_RESULT" = success
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-x64-*
          merge-multiple: true
          path: artifacts/macos-test-results
      - name: Verify complete three-framework Intel results
        shell: pwsh
        run: >-
          ./packaging/VerifyTestResults.ps1
          -ResultsDirectory artifacts/macos-test-results
          -ContractPath packaging/test-results.json
