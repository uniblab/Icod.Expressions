name: Verify fresh PCRE package consumer
description: Pack the built library, restore only that candidate in an isolated cache, and verify the internal byte consumer.
inputs:
  configuration:
    required: true
    description: Staging or Release configuration
runs:
  using: composite
  steps:
    - name: Build and verify isolated package-only PCRE consumer
      shell: pwsh
      env:
        PCRE_SMOKE_CONFIGURATION: ${{ inputs.configuration }}
      run: |
        $ErrorActionPreference = 'Stop'
        Set-StrictMode -Version Latest
        $pcreSmokeRoot = Join-Path $env:RUNNER_TEMP ('icod-pcre-smoke-' + [Guid]::NewGuid().ToString('N'))
        $pcreSmokeFeed = Join-Path $pcreSmokeRoot 'feed'
        $pcreSmokeCache = Join-Path $pcreSmokeRoot 'cache'
        New-Item -ItemType Directory -Path $pcreSmokeFeed, $pcreSmokeCache | Out-Null
        dotnet pack Icod.Expressions.csproj -c $env:PCRE_SMOKE_CONFIGURATION --no-build --no-restore -o $pcreSmokeFeed
        if ($LASTEXITCODE -ne 0) { throw 'PCRE candidate pack failed.' }
        $env:NUGET_PACKAGES = $pcreSmokeCache
        dotnet restore samples/PackageSmoke/PackageSmoke.csproj --source $pcreSmokeFeed --no-cache --force-evaluate
        if ($LASTEXITCODE -ne 0) { throw 'Isolated PCRE package restore failed.' }
        dotnet build samples/PackageSmoke/PackageSmoke.csproj -c $env:PCRE_SMOKE_CONFIGURATION --no-restore
        if ($LASTEXITCODE -ne 0) { throw 'PCRE package consumer build failed.' }
        $pcreSmokeOutput = @(dotnet run --project samples/PackageSmoke/PackageSmoke.csproj -c $env:PCRE_SMOKE_CONFIGURATION --no-build --no-restore -f net10.0)
        $pcreSmokeExitCode = $LASTEXITCODE
        $pcreSmokeOutput | ForEach-Object { Write-Host $_ }
        if ($pcreSmokeExitCode -ne 0) { throw 'PCRE package consumer failed.' }
        $pcreSmokeRecords = @($pcreSmokeOutput | Where-Object { $_ -match '^\{"kind":"pcre-package-smoke",' } | ForEach-Object { $_ | ConvertFrom-Json })
        if ($pcreSmokeRecords.Count -ne 1 -or $pcreSmokeRecords[0].cases -ne 42 -or $pcreSmokeRecords[0].view -ne 1 -or $pcreSmokeRecords[0].cancellation -ne 2 -or $pcreSmokeRecords[0].failed -ne 0) {
          throw 'Expected one complete 42-protocol/one-view/two-cancellation PCRE package result.'
        }
        Write-Host 'PASS: fresh PCRE package consumer: 42 protocols, one view, two cancellation controls'
        $pcreAllocationRecords = @($pcreSmokeOutput | Where-Object { $_ -match '^\{"kind":"pcre-allocation-smoke",' } | ForEach-Object { $_ | ConvertFrom-Json })
        if ($pcreAllocationRecords.Count -ne 1 -or $pcreAllocationRecords[0].passed -ne 4 -or $pcreAllocationRecords[0].failed -ne 0 -or @($pcreAllocationRecords[0].profiles).Count -ne 4) {
          throw 'Expected one complete four-profile PCRE allocation result.'
        }
        $pcreAllocationNames = @($pcreAllocationRecords[0].profiles | ForEach-Object { $_.name } | Sort-Object -Unique)
        $pcreAllocationExpectedNames = @('raw-code-unit', 'utf8-dot', 'ucp-letter', 'utf8-no-match') | Sort-Object
        if (($pcreAllocationNames -join '|') -cne ($pcreAllocationExpectedNames -join '|')) { throw 'PCRE allocation profile names differ.' }
        foreach ($pcreAllocation in $pcreAllocationRecords[0].profiles) {
          if ($pcreAllocation.smallInputBytes -ne 1024 -or $pcreAllocation.largeInputBytes -ne 65536 -or $pcreAllocation.iterations -ne 8 -or $pcreAllocation.allowanceBytesPerCall -ne 4096 -or $pcreAllocation.smallAllocatedBytes -lt 0 -or $pcreAllocation.largeAllocatedBytes -lt 0 -or ($pcreAllocation.largeAllocatedBytes - $pcreAllocation.smallAllocatedBytes) -gt (4096L * 8)) {
            throw 'PCRE allocation evidence violates the paired-input contract.'
          }
        }
        Write-Host 'PASS: paired PCRE allocation evidence: four profiles'
        $pcreFragmentRecords = @($pcreSmokeOutput | Where-Object { $_ -match '^\{"kind":"pcre-fragment-allocation-smoke",' } | ForEach-Object { $_ | ConvertFrom-Json })
        if ($pcreFragmentRecords.Count -ne 1 -or $pcreFragmentRecords[0].passed -ne 6 -or $pcreFragmentRecords[0].failed -ne 0 -or @($pcreFragmentRecords[0].profiles).Count -ne 6) {
          throw 'Expected one complete six-profile anchored fragment allocation result.'
        }
        $pcreFragmentNames = @($pcreFragmentRecords[0].profiles | ForEach-Object { $_.name } | Sort-Object -Unique)
        $pcreFragmentExpectedNames = @('caller-match', 'caller-miss', 'caller-late', 'caller-invalid-empty', 'dotstar-match', 'dotstar-miss') | Sort-Object
        if (($pcreFragmentNames -join '|') -cne ($pcreFragmentExpectedNames -join '|')) { throw 'Anchored fragment profile names differ.' }
        foreach ($pcreFragment in $pcreFragmentRecords[0].profiles) {
          if ($pcreFragment.smallInputBytes -ne 1024 -or $pcreFragment.largeInputBytes -ne 65536 -or $pcreFragment.iterations -ne 8 -or $pcreFragment.allowanceBytesPerCall -ne 4096 -or $pcreFragment.smallAllocatedBytes -lt 0 -or $pcreFragment.largeAllocatedBytes -lt 0 -or ($pcreFragment.largeAllocatedBytes - $pcreFragment.smallAllocatedBytes) -gt (4096L * 8)) {
            throw 'Anchored fragment allocation evidence violates the paired-input contract.'
          }
        }
        Write-Host 'PASS: bounded anchored fragment allocations: six profiles'
        $pcreCaptureInfoRecords = @($pcreSmokeOutput | Where-Object { $_ -match '^\{"kind":"pcre-capture-info-smoke",' } | ForEach-Object { $_ | ConvertFrom-Json })
        if ($pcreCaptureInfoRecords.Count -ne 1 -or $pcreCaptureInfoRecords[0].cases -ne 214 -or $pcreCaptureInfoRecords[0].failed -ne 0) {
          throw 'Expected one complete 214-case PCRE capture metadata result.'
        }
        Write-Host 'PASS: immutable PCRE capture metadata: 214 protocols'
        $pcreNamedCaptureRecords = @($pcreSmokeOutput | Where-Object { $_ -match '^\{"kind":"pcre-named-capture-smoke",' } | ForEach-Object { $_ | ConvertFrom-Json })
        if ($pcreNamedCaptureRecords.Count -ne 1 -or $pcreNamedCaptureRecords[0].cases -ne 976 -or $pcreNamedCaptureRecords[0].failed -ne 0) {
          throw 'Expected one complete 976-case PCRE named capture result.'
        }
        Write-Host 'PASS: bound PCRE named capture results: 976 protocols'
        $pcrePolicyRecords = @($pcreSmokeOutput | Where-Object { $_ -match '^\{"kind":"pcre-match-policy-smoke",' } | ForEach-Object { $_ | ConvertFrom-Json })
        if ($pcrePolicyRecords.Count -ne 1 -or $pcrePolicyRecords[0].patterns -ne 56 -or $pcrePolicyRecords[0].cases -ne 3584 -or $pcrePolicyRecords[0].failed -ne 0) {
          throw 'Expected one complete 56-pattern/3584-protocol per-call PCRE policy result.'
        }
        Write-Host 'PASS: immutable per-call PCRE policies: 3584 protocols'
        $pcreCommitFragmentRecords = @($pcreSmokeOutput | Where-Object { $_ -match '^\{"kind":"pcre-commit-fragment-smoke",' } | ForEach-Object { $_ | ConvertFrom-Json })
        if ($pcreCommitFragmentRecords.Count -ne 1 -or $pcreCommitFragmentRecords[0].patterns -ne 52 -or $pcreCommitFragmentRecords[0].cases -ne 3328 -or $pcreCommitFragmentRecords[0].failed -ne 0) {
          throw 'Expected one complete 52-pattern/3328-protocol COMMIT fragment result.'
        }
        Write-Host 'PASS: COMMIT fragment restarts and physical end anchors: 3328 protocols'
        $pcreFragmentCaretRecords = @($pcreSmokeOutput | Where-Object { $_ -match '^\{"kind":"pcre-fragment-caret-smoke",' } | ForEach-Object { $_ | ConvertFrom-Json })
        if ($pcreFragmentCaretRecords.Count -ne 1 -or $pcreFragmentCaretRecords[0].patterns -ne 48 -or $pcreFragmentCaretRecords[0].cases -ne 3072 -or $pcreFragmentCaretRecords[0].failed -ne 0) {
          throw 'Expected one complete 48-pattern/3072-protocol fragment caret result.'
        }
        Write-Host 'PASS: multiline caret boundaries in interpreted UTF fragments: 3072 protocols'
        $pcreOptionalRewindRecords = @($pcreSmokeOutput | Where-Object { $_ -match '^\{"kind":"pcre-optional-rewind-smoke",' } | ForEach-Object { $_ | ConvertFrom-Json })
        if ($pcreOptionalRewindRecords.Count -ne 1 -or $pcreOptionalRewindRecords[0].patterns -ne 48 -or $pcreOptionalRewindRecords[0].cases -ne 3072 -or $pcreOptionalRewindRecords[0].failed -ne 0) {
          throw 'Expected one complete 48-pattern/3072-protocol optional rewind result.'
        }
        Write-Host 'PASS: interpreted optional lookbehind at UTF fragment barriers: 3072 protocols'
        $pcreInterpretedBoundaryRecords = @($pcreSmokeOutput | Where-Object { $_ -match '^\{"kind":"pcre-interpreted-boundary-smoke",' } | ForEach-Object { $_ | ConvertFrom-Json })
        if ($pcreInterpretedBoundaryRecords.Count -ne 1 -or $pcreInterpretedBoundaryRecords[0].patterns -ne 48 -or $pcreInterpretedBoundaryRecords[0].cases -ne 3072 -or $pcreInterpretedBoundaryRecords[0].failed -ne 0) {
          throw 'Expected one complete 48-pattern/3072-protocol interpreted word boundary result.'
        }
        Write-Host 'PASS: interpreted word boundaries at malformed UTF starts: 3072 protocols'
        $pcreInterpretedCutRecords = @($pcreSmokeOutput | Where-Object { $_ -match '^\{"kind":"pcre-interpreted-cut-smoke",' } | ForEach-Object { $_ | ConvertFrom-Json })
        if ($pcreInterpretedCutRecords.Count -ne 1 -or $pcreInterpretedCutRecords[0].patterns -ne 48 -or $pcreInterpretedCutRecords[0].cases -ne 3072 -or $pcreInterpretedCutRecords[0].failed -ne 0) {
          throw 'Expected one complete 48-pattern/3072-protocol interpreted callee cut result.'
        }
        Write-Host 'PASS: interpreted callee cut capture rollback: 3072 protocols'
        $pcreInterpretedThenRecords = @($pcreSmokeOutput | Where-Object { $_ -match '^\{"kind":"pcre-interpreted-then-smoke",' } | ForEach-Object { $_ | ConvertFrom-Json })
        if ($pcreInterpretedThenRecords.Count -ne 1 -or $pcreInterpretedThenRecords[0].patterns -ne 48 -or $pcreInterpretedThenRecords[0].cases -ne 3072 -or $pcreInterpretedThenRecords[0].failed -ne 0) {
          throw 'Expected one complete 48-pattern/3072-protocol interpreted THEN assertion result.'
        }
        Write-Host 'PASS: interpreted THEN assertion catches: 3072 protocols'
