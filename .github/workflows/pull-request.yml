name: pull-request

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            configuration: Debug
          - os: ubuntu-latest
            configuration: Staging
          - os: ubuntu-latest
            configuration: Release
          - os: windows-latest
            configuration: Staging
          - os: macos-latest
            configuration: Staging
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Restore all target frameworks
        run: dotnet restore Icod.Expressions.sln
      - name: Build all target frameworks
        run: dotnet build Icod.Expressions.sln -c ${{ matrix.configuration }} --no-restore -p:ContinuousIntegrationBuild=true
      - name: Run original and supplemental regex tests
        shell: pwsh
        run: |
          foreach ($framework in @('net8.0', 'net9.0', 'net10.0')) {
            dotnet test tests/Icod.Expressions.Tests/Icod.Expressions.Tests.csproj -c ${{ matrix.configuration }} -f $framework --no-build --no-restore --logger "trx;LogFileName=$framework.trx"
            if ($LASTEXITCODE -ne 0) { throw "Test run failed: $framework" }
            $path = Join-Path 'tests/Icod.Expressions.Tests/TestResults' "$framework.trx"
            [xml]$results = Get-Content $path -Raw
            $counters = $results.SelectSingleNode("//*[local-name()='Counters']")
            if ($null -eq $counters -or [int]$counters.GetAttribute('total') -ne 198 -or [int]$counters.GetAttribute('passed') -ne 198 -or [int]$counters.GetAttribute('failed') -ne 0) {
              throw "Characterization test count drift: $framework"
            }
          }
      - name: Verify exact extraction parity
        shell: bash
        run: |
          set -e
          for framework in net8.0 net9.0 net10.0; do
            dotnet run --project tools/RegularExpressionParityBaseline/RegularExpressionParityBaseline.csproj -c ${{ matrix.configuration }} -f "$framework" -- --verify doc/Icod.Expressions-A04-Parity-Baseline.jsonl
          done
      - name: Compare POSIX ASCII cases with glibc
        if: matrix.os == 'ubuntu-latest' && matrix.configuration == 'Staging'
        run: dotnet run --project tools/PosixRegexDifferential/PosixRegexDifferential.csproj -c Staging
      - name: Verify differential runner identity
        if: matrix.os == 'ubuntu-latest' && matrix.configuration == 'Staging'
        shell: bash
        run: |
          test "$(git hash-object tools/PosixRegexDifferential/Program.cs)" = bec36b11aa2bd1617e191ac49703244a03dcc10b
      - name: Verify frozen test and fixture blobs
        if: matrix.os == 'ubuntu-latest' && matrix.configuration == 'Staging'
        run: sh tools/verify-frozen-corpus.sh
      - name: Verify supplemental consumer-shaped test identity
        if: matrix.os == 'ubuntu-latest' && matrix.configuration == 'Staging'
        shell: bash
        run: |
          test "$(git hash-object tests/Icod.Expressions.Tests/RegularExpressions/IcodExpressionsA04ConsumerShapeTests.cs)" = 589a52b42d5e3010e9e678f771cc85b156236e0b
      - name: Verify unchanged production source blobs
        if: matrix.os == 'ubuntu-latest' && matrix.configuration == 'Staging'
        run: sh tools/verify-frozen-source.sh
      - name: Verify compiled public API members
        if: matrix.os == 'ubuntu-latest' && matrix.configuration == 'Staging'
        shell: bash
        run: |
          dotnet run --project tools/RegularExpressionApiSnapshot/RegularExpressionApiSnapshot.csproj -c Staging > /tmp/icod-expressions-api.txt
          diff <(tail -n +2 doc/Icod.Expressions-A00-Compiled-API.txt) <(tail -n +2 /tmp/icod-expressions-api.txt)
      - name: Pack alpha candidate
        if: matrix.os == 'ubuntu-latest' && matrix.configuration == 'Staging'
        run: dotnet pack src/Icod.Expressions/Icod.Expressions.csproj -c Staging --no-build --no-restore -o artifacts
      - name: Restore package-only consumer
        if: matrix.os == 'ubuntu-latest' && matrix.configuration == 'Staging'
        run: dotnet restore samples/PackageSmoke/PackageSmoke.csproj --source artifacts
      - name: Build package-only consumer
        if: matrix.os == 'ubuntu-latest' && matrix.configuration == 'Staging'
        run: dotnet build samples/PackageSmoke/PackageSmoke.csproj -c Staging --no-restore
      - name: Run package-only consumer
        if: matrix.os == 'ubuntu-latest' && matrix.configuration == 'Staging'
        shell: bash
        run: |
          set -e
          for framework in net8.0 net9.0 net10.0; do
            dotnet run --project samples/PackageSmoke/PackageSmoke.csproj -c Staging --no-build --no-restore -f "$framework"
          done
      - name: Run source-pinned consumers with package-backed scratch bridge
        if: matrix.os == 'ubuntu-latest' && matrix.configuration == 'Staging'
        run: sh tools/ConsumerBridgeProbe/run.sh artifacts
